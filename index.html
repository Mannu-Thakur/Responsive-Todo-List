<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crazy To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="heading">🚀 Crazy To-Do List</h1>
        <div class="list">
            <input type="text" id="say" placeholder="What's on your mind?" />
            <button id="addButton">➕ Add Task</button>
            <button id="deleteButton">🗑️ Delete Completed</button>
            <button id="editButton">✏️ Edit Selected</button>
            <button id="markButton">✅ Mark as Done</button>
            <button id="doneButton">↩️ Mark as Undone</button>
            <ul id="todoList"></ul>
        </div>
    </div>
    <script src="todo.js"></script>
</body>
</html>
